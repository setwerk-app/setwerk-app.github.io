<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Setwerk Banner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0b0d11;font-family:-apple-system,system-ui,"SF Pro Display",sans-serif;color:#e8ebf2}
.bg{position:absolute;inset:0;background:
  radial-gradient(600px 400px at 85% 20%,#ff5c3933,transparent 70%),
  radial-gradient(500px 380px at 70% 95%,#ffb23826,transparent 70%),
  radial-gradient(700px 500px at 0% 100%,#5aa9ff14,transparent 70%),#0b0d11}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,#000 0%,transparent 60%)}
.left{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;gap:20px}
.brand img{width:96px;height:96px;filter:drop-shadow(0 12px 30px #ff5c3955)}
.brand h1{font-size:76px;margin:0;font-weight:850;letter-spacing:-.035em}
.claim{font-size:30px;font-weight:700;line-height:1.2;margin:28px 0 14px;letter-spacing:-.01em}
.claim span{background:linear-gradient(90deg,#ff5c39,#ffb238);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#8b93a7;font-size:18px;line-height:1.5;margin:0 0 26px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #2a3040;background:#151922cc;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:#c9cfdc}
.win{position:absolute;left:640px;top:86px;width:760px;border-radius:14px;overflow:hidden;border:1px solid #2a3040;box-shadow:0 40px 90px #000c,0 0 0 1px #ffffff0a;transform:perspective(1600px) rotateY(-14deg) rotateX(4deg);transform-origin:left center;background:#0d0f14}
.bar{height:30px;background:#151922;display:flex;align-items:center;gap:7px;padding:0 12px;border-bottom:1px solid #2a3040}.bar i{width:11px;height:11px;border-radius:50%;background:#3a4152}.bar i:nth-child(1){background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.win img{display:block;width:100%}
.phone{position:absolute;left:600px;top:250px;width:190px;border-radius:30px;overflow:hidden;border:6px solid #1c212d;box-shadow:0 30px 70px #000d;background:#0d0f14}
.phone img{display:block;width:100%}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="left">
  <div class="brand"><img src="../icons/icon-512.png" alt=""><h1>Setwerk</h1></div>
  <div class="claim">Du nennst die Stimmung –<br><span>Setwerk baut das Set.</span></div>
  <p class="sub">DJ-Sets nach echter Mix-Theorie: Tonart, Tempo und Energiekurve – mit Mix-Coach für jeden Übergang.</p>
  <div class="chips"><span class="chip">Serato DJ Pro</span><span class="chip">Rekordbox</span><span class="chip">Traktor</span><span class="chip">macOS · Web · iPhone</span></div>
</div>
<div class="win"><div class="bar"><i></i><i></i><i></i></div><img src="screens/builder.jpg" alt=""></div>
<div class="phone"><img src="screens/mobile-home.jpg" alt=""></div>
</body></html>
